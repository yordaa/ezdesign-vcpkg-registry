name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  BRIDGE_TAG: v1.1.0

jobs:
  install:
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    strategy:
      matrix:
        include:
          - os: macos-15
            triplet: arm64-osx
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test the checked-out registry
        shell: bash
        run: >-
          git config --global
          url."$GITHUB_WORKSPACE".insteadOf
          https://github.com/yordaa/ezdesign-vcpkg-registry
      - name: Prepare vcpkg cache
        run: cmake -E make_directory .vcpkg-binary-cache
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: .vcpkg-binary-cache
          key: ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-v2-${{ hashFiles('examples/consumer/vcpkg.json', 'examples/consumer/vcpkg-configuration.json', 'ports/**', 'versions/**') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-v2-
      - uses: lukka/run-vcpkg@v11
      - name: Install from registry
        run: >-
          vcpkg install
          --x-manifest-root=${{ github.workspace }}/examples/consumer
          --triplet=${{ matrix.triplet }}
      - name: Remesh a closed triangle mesh
        shell: bash
        run: |
          installed="${{ github.workspace }}/examples/consumer/vcpkg_installed/${{ matrix.triplet }}"
          tool="$installed/tools/autoremesher/autoremesher-cli${{ runner.os == 'Windows' && '.exe' || '' }}"
          input="$RUNNER_TEMP/tetrahedron.obj"
          output="$RUNNER_TEMP/remeshed.obj"
          printf '%s\n' \
            'v 0 0 0' 'v 1 0 0' 'v 0 1 0' 'v 0 0 1' \
            'f 1 3 2' 'f 1 2 4' 'f 1 4 3' 'f 2 3 4' > "$input"
          "$tool" --input "$input" --output "$output" --target-quads 10 --threads 1 |
            grep -q '^RESULT '
          test -s "$output"
          test -f "$installed/share/autoremesher/copyright"
      - name: Convert representative EZD fixture
        shell: bash
        run: |
          installed="${{ github.workspace }}/examples/consumer/vcpkg_installed/${{ matrix.triplet }}"
          tool="$installed/tools/ezdesign-step-bridge/ezd2step${{ runner.os == 'Windows' && '.exe' || '' }}"
          source_root="$RUNNER_TEMP/bridge-source"
          archive="$RUNNER_TEMP/bridge.tar.gz"
          output="$RUNNER_TEMP/20260427.step"
          validator_build="$RUNNER_TEMP/bridge-validator"
          mkdir -p "$source_root"
          curl --fail --location --output "$archive" \
            "https://github.com/yordaa/ezdesign-step-bridge/archive/$BRIDGE_TAG.tar.gz"
          cmake -E chdir "$source_root" cmake -E tar xzf "$archive"
          source_dir="$(find "$source_root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fixture="$source_dir/tests/data/20260427.ezd"
          "$tool" "$fixture" "$output"
          cmake -S "$source_dir" -B "$validator_build" \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$installed"
          cmake --build "$validator_build" --config Release \
            --target test_20260427_conversion --parallel 2
          validator="$(find "$validator_build" -type f \
            -name "test_20260427_conversion${{ runner.os == 'Windows' && '.exe' || '' }}" \
            -print -quit)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            PATH="$(cygpath --unix "$installed/bin"):$PATH"
          fi
          "$validator" "$output"
          test -f "$installed/share/ezdesign-step-bridge/LICENSE"
          test -f "$installed/share/ezdesign-step-bridge/NOTICE"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$installed/share/opencascade/copyright"
          grep -qi "Open CASCADE exception" "$installed/share/opencascade/copyright"
          ! vcpkg list --x-install-root="${{ github.workspace }}/examples/consumer/vcpkg_installed" | grep -Eiq "^(freeimage|freetype|rapidjson|vtk):"
      - name: Verify macOS dynamic OCCT linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          installed="${{ github.workspace }}/examples/consumer/vcpkg_installed/${{ matrix.triplet }}"
          otool -L "$installed/tools/ezdesign-step-bridge/ezd2step" | grep -q libTKDESTEP
          test "$(find "$installed/lib" -maxdepth 1 -type f -name 'libTK*.dylib' | wc -l | tr -d ' ')" = 23
      - name: Verify Windows dynamic OCCT linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = "${{ github.workspace }}/examples/consumer/vcpkg_installed/${{ matrix.triplet }}"
          $tool = "$installed/tools/ezdesign-step-bridge/ezd2step.exe"
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -Last 1
          if (-not (& $dumpbin /dependents $tool | Select-String TKDESTEP)) {
            throw "ezd2step is not dynamically linked to TKDESTEP"
          }
          if ((Get-ChildItem "$installed/bin/TK*.dll").Count -ne 23) {
            throw "Expected the 23-toolkit TKDESTEP closure"
          }
